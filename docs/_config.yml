title: aichteeteapee
tagline: Go HTTP server, middleware, WebSockets and client
description: A Go HTTP library built on net/http with grouped routing, middleware, file uploads, static serving, WebSocket hubs, request forwarding with caching, and an HTTP client.
lang: en
url: https://psyb0t.github.io
baseurl: /aichteeteapee
repository: psyb0t/aichteeteapee
author: Ciprian Mandache

